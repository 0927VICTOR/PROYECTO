version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gambatte_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./gambatte20231205.sql:/docker-entrypoint-initdb.d/gambatte20231205.sql:ro
      - ./tablas_gambatte20231205.sql:/docker-entrypoint-initdb.d/tablas_gambatte20231205.sql:ro
    networks:
      - 1trader_network

  backend:
    build: ./1trader-back
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_NAME=gambatte_db
      - USER_NAME_DATABASE=root
      - PASSWORD_USER_DATABASE=root
      - HOST_NAME_DATABASE=db
    depends_on:
      - db
    networks:
      - 1trader_network

  frontend:
    build: ./1trader-front
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REACT_APP_API_URL=http://localhost:4000/1trader/api
    depends_on:
      - backend
    networks:
      - 1trader_network

  landing-page:
    build: ./1trader-web-page
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    networks:
      - 1trader_network

volumes:
  db_data:
    name: gambatte_db_data

networks:
  1trader_network:
    driver: bridge
